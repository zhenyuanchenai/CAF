DATALOADER:
  TRAIN_X:
    BATCH_SIZE: 32
  TEST:
    BATCH_SIZE: 64
  NUM_WORKERS: 2
  K_TRANSFORMS: 4
  RETURN_IMG0: false

INPUT:
  SIZE: (224, 224)
  INTERPOLATION: "bicubic"
  PIXEL_MEAN: [0.48145466, 0.4578275, 0.40821073]
  PIXEL_STD: [0.26862954, 0.26130258, 0.27577711]
  TRANSFORMS: ["random_resized_crop", "random_flip", "randaugment2", "normalize"]
  RANDAUGMENT_N: 2
  RANDAUGMENT_M: 10

OPTIM:
  NAME: "sgd"
  LR: 0.01
  MOMENTUM: 0.9
  WEIGHT_DECAY: 0.0005
  MAX_EPOCH: 20
  LR_SCHEDULER: "cosine"
  WARMUP_EPOCH: 1
  WARMUP_TYPE: "constant"
  WARMUP_CONS_LR: 0.00001

TRAIN:
  PRINT_FREQ: 20
  CHECKPOINT_FREQ: 1

TEST:
  NO_TEST: true
  FINAL_MODEL: "last_step"
  SPLIT: "test"
  READOUT: "fusion"

MODEL:
  BACKBONE:
    NAME: "ViT-B/16"

TRAINER:
  NAME: "CAF"
  CAF:
    N_CTX: 8
    PROMPT_DEPTH: 12
    PREC: "amp"
    LAMBDA_MARGIN: 4.0
    LAMBDA_TEXT: 2.5
    GATE_LR: 0.001
    GATE_WARMUP_LR: 0.0000025
    ALPHA_INIT: 16.0
    BETA_INIT: 10.849894523620605
    EMA_RATE: 0.01
    EPOCH_SEED_OFFSET: 0
    CHECKPOINTING: true

DATASET:
  NUM_SHOTS: 16
